<?xml stroke="1.0" charset="utf-8"?>
<svg xmlns:xlink="http://www.w3.org/1999/xlink" id="figura2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520">
                    <rect width="100%" height="100%" fill="#ffffff"/>

                    <!-- Central Fact Table -->
                    <g transform="translate(300, 180)">
                        <rect width="300" height="180" rx="8" fill="#1e3a8a" stroke="#1d4ed8" stroke-width="2"/>
                        <rect width="300" height="35" rx="8" fill="#1e40af"/>
                        <text x="150" y="23" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Hechos_Rendimiento_Academico</text>
                        
                        <text x="15" y="58" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f59e0b">PK  id_hecho : INTEGER</text>
                        <text x="15" y="78" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1">FK  id_estudiante : VARCHAR(50)</text>
                        <text x="15" y="98" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1">FK  id_facultad : INT</text>
                        <text x="15" y="118" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1">FK  id_tiempo : INT</text>
                        <text x="15" y="138" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">    promedio_ponderado : REAL</text>
                        <text x="15" y="158" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">    asistencia_lms_pct : REAL</text>
                    </g>

                    <!-- Dim_Estudiante (Top Left) -->
                    <g transform="translate(40, 20)">
                        <rect width="230" height="140" rx="6" fill="#f8fafc" stroke="#0284c7" stroke-width="2"/>
                        <rect width="230" height="30" rx="6" fill="#0284c7"/>
                        <text x="115" y="20" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Dim_Estudiante</text>
                        
                        <text x="12" y="50" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#d97706">PK  id_estudiante : VARCHAR</text>
                        <text x="12" y="70" font-family="Arial, sans-serif" font-size="11" fill="#334155">    nombre_unificado : TEXT</text>
                        <text x="12" y="90" font-family="Arial, sans-serif" font-size="11" fill="#334155">    documento_hash : TEXT</text>
                        <text x="12" y="110" font-family="Arial, sans-serif" font-size="11" fill="#334155">    programa_academico : TEXT</text>
                        <text x="12" y="130" font-family="Arial, sans-serif" font-size="11" fill="#334155">    estado_matricula : VARCHAR</text>
                    </g>

                    <!-- Dim_Facultad (Top Right) -->
                    <g transform="translate(630, 20)">
                        <rect width="230" height="140" rx="6" fill="#f8fafc" stroke="#0284c7" stroke-width="2"/>
                        <rect width="230" height="30" rx="6" fill="#0284c7"/>
                        <text x="115" y="20" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Dim_Facultad</text>
                        
                        <text x="12" y="50" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#d97706">PK  id_facultad : INT</text>
                        <text x="12" y="70" font-family="Arial, sans-serif" font-size="11" fill="#334155">    nombre_facultad : TEXT</text>
                        <text x="12" y="90" font-family="Arial, sans-serif" font-size="11" fill="#334155">    campus : TEXT</text>
                        <text x="12" y="110" font-family="Arial, sans-serif" font-size="11" fill="#334155">    decano_responsable : TEXT</text>
                    </g>

                    <!-- Dim_Tiempo (Bottom Right) -->
                    <g transform="translate(630, 360)">
                        <rect width="230" height="140" rx="6" fill="#f8fafc" stroke="#0284c7" stroke-width="2"/>
                        <rect width="230" height="30" rx="6" fill="#0284c7"/>
                        <text x="115" y="20" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Dim_Tiempo</text>
                        
                        <text x="12" y="50" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#d97706">PK  id_tiempo : INT</text>
                        <text x="12" y="70" font-family="Arial, sans-serif" font-size="11" fill="#334155">    fecha : DATE</text>
                        <text x="12" y="90" font-family="Arial, sans-serif" font-size="11" fill="#334155">    anio : INT</text>
                        <text x="12" y="110" font-family="Arial, sans-serif" font-size="11" fill="#334155">    semestre : VARCHAR</text>
                        <text x="12" y="130" font-family="Arial, sans-serif" font-size="11" fill="#334155">    periodo_academico : TEXT</text>
                    </g>

                    <!-- Dim_Bienestar (Bottom Left) -->
                    <g transform="translate(40, 360)">
                        <rect width="230" height="140" rx="6" fill="#f8fafc" stroke="#0284c7" stroke-width="2"/>
                        <rect width="230" height="30" rx="6" fill="#0284c7"/>
                        <text x="115" y="20" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Dim_Bienestar</text>
                        
                        <text x="12" y="50" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#d97706">PK  id_bienestar : INT</text>
                        <text x="12" y="70" font-family="Arial, sans-serif" font-size="11" fill="#334155">    tipo_atencion : TEXT</text>
                        <text x="12" y="90" font-family="Arial, sans-serif" font-size="11" fill="#334155">    categoria_apoyo : TEXT</text>
                        <text x="12" y="110" font-family="Arial, sans-serif" font-size="11" fill="#334155">    nivel_riesgo_socio : VARCHAR</text>
                    </g>

                    <!-- Connecting Lines (Relationships) -->
                    <line x1="270" y1="120" x2="350" y2="180" stroke="#0284c7" stroke-width="2" stroke-dasharray="5,5"/>
                    <line x1="630" y1="120" x2="550" y2="180" stroke="#0284c7" stroke-width="2" stroke-dasharray="5,5"/>
                    <line x1="630" y1="390" x2="550" y2="360" stroke="#0284c7" stroke-width="2" stroke-dasharray="5,5"/>
                    <line x1="270" y1="390" x2="350" y2="360" stroke="#0284c7" stroke-width="2" stroke-dasharray="5,5"/>

                    <!-- Relationship Labels (1 to N) -->
                    <text x="280" y="135" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0284c7">1</text>
                    <text x="335" y="175" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0284c7">N</text>

                    <text x="615" y="135" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0284c7">1</text>
                    <text x="560" y="175" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0284c7">N</text>

                    <text x="615" y="380" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0284c7">1</text>
                    <text x="560" y="355" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0284c7">N</text>

                    <text x="280" y="380" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0284c7">1</text>
                    <text x="335" y="355" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0284c7">N</text>
                </svg>