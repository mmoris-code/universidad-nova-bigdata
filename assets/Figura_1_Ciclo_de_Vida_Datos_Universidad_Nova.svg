                        <text x="85" y="135" font-family="Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">• Admin. BD (DBA)</text>
                        <text x="85" y="155" font-family="Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">• Equipo DevOps</text>
                        <text x="85" y="175" font-family="Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">• Oficina de TI</text>
                        <text x="85" y="195" font-family="Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">• Proveedores Cloud</text>
                    </g>

