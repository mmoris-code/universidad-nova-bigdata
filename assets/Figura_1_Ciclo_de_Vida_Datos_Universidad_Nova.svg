<?xml stroke="1.0" charset="utf-8"?>
<svg xmlns:xlink="http://www.w3.org/1999/xlink" id="figura1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 320" width="950" height="320">
                    <rect width="100%" height="100%" fill="#ffffff"/>
                    
                    <!-- Title Banner -->
