                        <text x="85" y="175" font-family="Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">• Registro Académico</text>
                        <text x="85" y="195" font-family="Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">• Admisiones / RRHH</text>
                    </g>

